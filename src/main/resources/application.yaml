ktor:
  application:
    modules:
      - com.example.ApplicationKt.module
  deployment:
    port: 8080
jwt:
  domain: "https://jwt-provider-domain/"
  audience: "jwt-audience"
  realm: "ktor sample app"

db:
  postgres:
    jdbcDriver: "org.postgresql.Driver"
    url: "jdbc:postgresql://localhost:5435/postgres"
    user: postgres
    password: postgres
    maxPoolSize: 5
  mongo:
    # для локального docker-compose (Mongo без auth) — оставьте user/password пустыми или закомментируйте
    # user: mongo
    # password: mongo
    host: localhost
    port: 27018
    database:
      name: library
  neo4j:
    uri: "bolt://localhost:7687"
    user: neo4j
    password: password

kafka:
  # для запуска приложения на хосте (docker-compose пробрасывает 9092–9094)
  bootstrapServers: "localhost:9092,localhost:9093,localhost:9094"
  topic: "library_events"
  groupId: "library-consumers"

flyway:
  clean: false