version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["5435:5432"]
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_sub:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["5436:5432"]
    depends_on: [postgres]
    volumes:
      - postgres_sub_data:/var/lib/postgresql/data

  pgbackups:
    image: bash
    volumes:
      - ./backup.sh:/backup.sh
      - ./dumps:/dumps
    depends_on:
      - postgres
    entrypoint: [ "bash", "-lc", "while true; do /backup.sh; sleep 86400; done" ]

  mongodb:
    image: mongo:6
    container_name: library_mongo
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      # Подключаемся к твоему первому сервису 'postgres'
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable"
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - postgres-exporter
      - neo4j

  grafana:
    image: grafana/grafana
    container_name: library_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: library_mongo_exporter
    command:
      - '--mongodb.uri=mongodb://test:testing@library_mongo:27017/admin?replicaSet=rs0'
      - '--collect-all'
      - '--compatible-mode'
    ports:
      - "9216:9216"
    depends_on:
      - mongodb

  redis:
    image: redis:7-alpine
    container_name: library_redis
    ports:
      - "6379:6379"
    restart: always
  neo4j:
    image: neo4j:5
    container_name: library_neo4j
    hostname: neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
      - "2000:2000"   # Prometheus (только Enterprise; Community — см. neo4j-exporter)
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_metrics_enabled=true
      - NEO4J_server_metrics_prometheus_enabled=true
      - NEO4J_server_metrics_prometheus_http__enabled=true
      - NEO4J_server_metrics_prometheus_http__address=0.0.0.0:2000
      - NEO4J_server_config_strict__validation_enabled=false
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=512m
      - NEO4J_dbms_memory_pagecache_size=256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/plugins:/plugins
    restart: unless-stopped

  # Экспортер метрик для Neo4j Community (встроенный Prometheus только в Enterprise)
  neo4j-exporter:
    build: ./neo4j_exporter
    container_name: library_neo4j_exporter
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    ports:
      - "5000:5000"
    depends_on:
      - neo4j
volumes:
  postgres_data:
  mongo_data:
  postgres_sub_data:
  neo4j_data:
  neo4j_logs:
